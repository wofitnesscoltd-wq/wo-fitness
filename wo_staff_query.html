<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>窩 WoFitness｜員工查詢系統</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');

  :root {
    --orange: #E8620A;
    --orange-light: #F5874A;
    --orange-pale: #FFF0E8;
    --cream: #FDF8F3;
    --dark: #1A1208;
    --gray: #8A7A6A;
    --border: #E8DDD4;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--cream);
    color: var(--dark);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    background: var(--orange);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  header .logo {
    width: 36px;
    height: 36px;
    background: white;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    color: var(--orange);
    font-size: 14px;
  }

  header h1 {
    color: white;
    font-size: 16px;
    font-weight: 500;
  }

  header span {
    color: rgba(255,255,255,0.7);
    font-size: 13px;
    margin-left: auto;
  }

  .chat-container {
    flex: 1;
    overflow-y: auto;
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    max-width: 800px;
    width: 100%;
    margin: 0 auto;
  }

  .message {
    display: flex;
    gap: 10px;
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .message.user {
    flex-direction: row-reverse;
  }

  .avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
  }

  .avatar.ai {
    background: var(--orange);
    color: white;
  }

  .avatar.user {
    background: var(--dark);
    color: white;
  }

  .bubble {
    max-width: 75%;
    padding: 12px 16px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.7;
  }

  .message.ai .bubble {
    background: white;
    border: 1px solid var(--border);
    border-top-left-radius: 4px;
  }

  .message.user .bubble {
    background: var(--orange);
    color: white;
    border-top-right-radius: 4px;
  }

  .bubble strong {
    display: block;
    margin-bottom: 4px;
    font-weight: 700;
  }

  .bubble ul {
    padding-left: 16px;
    margin-top: 6px;
  }

  .bubble li {
    margin-bottom: 4px;
  }

  .bubble .tag {
    display: inline-block;
    background: var(--orange-pale);
    color: var(--orange);
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 20px;
    margin-bottom: 8px;
    font-weight: 500;
  }

  .bubble .divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 10px 0;
  }

  .typing {
    display: flex;
    gap: 4px;
    padding: 14px 16px;
  }

  .typing span {
    width: 7px;
    height: 7px;
    background: var(--orange-light);
    border-radius: 50%;
    animation: bounce 1.2s infinite;
  }

  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-6px); }
  }

  .quick-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 0 16px 8px;
    max-width: 800px;
    width: 100%;
    margin: 0 auto;
  }

  .quick-tag {
    background: white;
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 13px;
    cursor: pointer;
    color: var(--gray);
    transition: all 0.2s;
    font-family: inherit;
  }

  .quick-tag:hover {
    border-color: var(--orange);
    color: var(--orange);
    background: var(--orange-pale);
  }

  .input-area {
    border-top: 1px solid var(--border);
    padding: 16px;
    background: white;
  }

  .input-inner {
    max-width: 800px;
    margin: 0 auto;
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }

  textarea {
    flex: 1;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 16px;
    font-family: inherit;
    font-size: 14px;
    resize: none;
    min-height: 44px;
    max-height: 120px;
    line-height: 1.5;
    color: var(--dark);
    background: var(--cream);
    outline: none;
    transition: border-color 0.2s;
  }

  textarea:focus {
    border-color: var(--orange);
  }

  textarea::placeholder {
    color: var(--gray);
  }

  button.send {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: var(--orange);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
    flex-shrink: 0;
  }

  button.send:hover { background: var(--orange-light); }
  button.send:disabled { background: var(--border); cursor: not-allowed; }

  button.send svg {
    width: 18px;
    height: 18px;

  }

  .welcome-card {
    background: white;
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 8px;
  }

  .welcome-card h2 {

    font-weight: 700;
    margin-bottom: 8px;
    color: var(--orange);
  }

  .welcome-card p {
    font-size: 13px;
    color: var(--gray);
    line-height: 1.7;
  }
</style>
</head>
<body>

<header>

</header>


<div id="apiKeyModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:9999;align-items:center;justify-content:center;">
  <div style="background:white;border-radius:16px;padding:32px;width:90%;max-width:400px;">
    <div style="text-align:center;margin-bottom:20px;">
      <div style="width:48px;height:48px;background:#E8620A;border-radius:12px;display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:18px;margin:0 auto 12px;">窩</div>

</div>

<div class="chat-container" id="chatContainer">

    <div class="bubble">
      <div class="tag">系統就緒</div>

</div>

<div class="quick-tags">
  <button class="quick-tag" onclick="quickSend('學員要退課怎麼處理')">學員退課</button>
  <button class="quick-tag" onclick="quickSend('教練臨時請假怎麼辦')">教練請假</button>

<div class="input-area">

    <textarea id="userInput" placeholder="描述你遇到的情況..." rows="1"
      onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
    <button class="send" id="sendBtn" onclick="sendMessage()">
      <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
    </button>
  </div>
</div>

<script>

function getApiKey() {
  return localStorage.getItem('wo_api_key') || '';
}

function checkApiKey() {
  if (!getApiKey()) {
    document.getElementById('apiKeyModal').style.display = 'flex';
    return false;
  }
  return true;
}

function saveApiKey() {
  const key = document.getElementById('apiKeyInput').value.trim();
  if (!key.startsWith('sk-ant-')) {
    alert('API Key 格式不正確，請重新輸入');
    return;
  }
  localStorage.setItem('wo_api_key', key);
  document.getElementById('apiKeyModal').style.display = 'none';
}


const SYSTEM_PROMPT = `你是「窩WoFitness」的內部員工查詢助手。你的任務是根據窩的規則和合約，幫助員工快速處理各種情況。

let messages = [];
let isLoading = false;

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function quickSend(text) {
  document.getElementById('userInput').value = text;
  sendMessage();
}

function addMessage(role, content) {
  const container = document.getElementById('chatContainer');
  const div = document.createElement('div');
  div.className = `message ${role === 'user' ? 'user' : 'ai'}`;

  const avatar = document.createElement('div');
  avatar.className = `avatar ${role === 'user' ? 'user' : 'ai'}`;
  avatar.textContent = role === 'user' ? '員' : '窩';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = formatContent(content);

  div.appendChild(avatar);
  div.appendChild(bubble);
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

function formatContent(text) {
  return text
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/^[-・]\s(.+)/gm, '<li>$1</li>')
    .replace(/(<li>.*<\/li>)/gs, '<ul>$1</ul>')
    .replace(/\n/g, '<br>');
}

function showTyping() {
  const container = document.getElementById('chatContainer');
  const div = document.createElement('div');
  div.className = 'message ai';
  div.id = 'typingIndicator';

  const avatar = document.createElement('div');
  avatar.className = 'avatar ai';
  avatar.textContent = '窩';

  const bubble = document.createElement('div');
  bubble.className = 'bubble typing';
  bubble.innerHTML = '<span></span><span></span><span></span>';

  div.appendChild(avatar);
  div.appendChild(bubble);
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById('typingIndicator');
  if (el) el.remove();
}

async function sendMessage() {
  if (!checkApiKey()) return;
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if (!text || isLoading) return;

  isLoading = true;
  document.getElementById('sendBtn').disabled = true;
  input.value = '';
  input.style.height = 'auto';

  addMessage('user', text);
  messages.push({ role: 'user', content: text });

  showTyping();

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: SYSTEM_PROMPT,
        messages: messages
      })
    });

    const data = await response.json();
    const reply = data.content?.[0]?.text || '抱歉，發生錯誤，請再試一次。';

    removeTyping();
    addMessage('ai', reply);
    messages.push({ role: 'assistant', content: reply });

  } catch (err) {
    removeTyping();
    addMessage('ai', '⚠️ 連線發生問題，請檢查網路後再試。');
  }

  isLoading = false;
  document.getElementById('sendBtn').disabled = false;
  input.focus();
}
</script>
</body>
</html>
